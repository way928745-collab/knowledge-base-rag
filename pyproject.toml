[project]
name = "knowledge-base-rag"
version = "0.1.0"
description = "企业本地 RAG 知识库：自动解析、打标、入库、检索"
requires-python = ">=3.10"
dependencies = [
  "chromadb>=0.5.5",
  "fastembed>=0.3.5",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "PyYAML>=6.0",
]

[project.scripts]
kb = "kb_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kb_rag"]
py-modules = ["kb_cli"]